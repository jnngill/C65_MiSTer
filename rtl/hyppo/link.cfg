# ld65 configuration for the hypervisor program: 16K at $8000-$BFFF
# (rtl/m65_hyp.sv), zero page at $BF00 (B = $BF), hardware stack $BE00.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300;
}
MEMORY {
    ZP:     file = "",               start = $0002, size = $00FE, type = rw;
    ENTRY:  file = %O, fill = yes,   start = $8000, size = $0100;
    RAM:    file = %O, fill = yes,   start = $8100, size = $3A00;
    CSTACK: file = "", define = yes, start = $BB00, size = $0300;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    ENTRY:    load = ENTRY, type = ro;
    STARTUP:  load = RAM,   type = ro, optional = yes;
    ONCE:     load = RAM,   type = ro, optional = yes;
    CODE:     load = RAM,   type = ro;
    RODATA:   load = RAM,   type = ro;
    DATA:     load = RAM,   type = rw;
    BSS:      load = RAM,   type = bss, define = yes;
}
